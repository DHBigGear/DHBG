<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // 현재 접속하려는 주소와 상관없이 무조건 메인 페이지로 이동
    window.location.replace("https://dehyoung.com");
  </script>
</head>
<body>
  <p>페이지를 찾을 수 없습니다. 메인 페이지로 이동합니다...</p>
<script>
  // 내 PC(file://)가 아닌 실제 웹서버(http/https)에서 열렸을 때만 작동
  if (window.location.protocol !== 'file:') {
    // 1. 현재 주소창에 .html이 붙어 있다면 깔끔하게 숨김
    if (window.location.pathname.endsWith('.html')) {
      const cleanPath = window.location.pathname.slice(0, -5);
      window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
    }

    // 2. 페이지 내 모든 .html 링크를 확장자 없는 깔끔한 링크로 자동 변환
    document.querySelectorAll('a[href$=".html"]').forEach(link => {
      const href = link.getAttribute('href');
      if (href && !href.startsWith('http')) {
        link.setAttribute('href', href.slice(0, -5));
      }
    });
  }
</script>
</body>
</html>
